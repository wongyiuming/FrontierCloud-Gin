# Default native Go + SQLite deployment. Historical cluster volumes still need
# separately verified offline migration; changing .env never migrates data.
name: ${COMPOSE_PROJECT_NAME:-frontiercloud-gin}

x-app-image: &app-image
  env_file:
    - path: .env
      required: false
  image: ghcr.io/wongyiuming/frontiercloud-gin-web:${FRONTIERCLOUD_REVISION:-latest}

x-app-environment: &app-environment
  DB_TYPE: ${DB_TYPE:-sqlite}
  SQLITE_PATH: ${SQLITE_PATH:-/app/data/frontiercloud.db}
  DATA_ROOT: /app/data
  SECRETS_DIR: /run/frontiercloud-secrets
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-office_automation}
  MYSQL_USER: ${MYSQL_USER:-media_admin}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SERVER_NAME: ${SERVER_NAME:-localhost}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
  SECURITY_CONTACT: ${SECURITY_CONTACT:-}
  RELEASE_MANIFEST_PATH: ${RELEASE_MANIFEST_PATH:-}
  TLS_ENABLED: ${TLS_ENABLED:-false}

x-logging: &service-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  # Mandatory host entry; bootstrap from an independently published immutable bundle.
  foc-host-init:
    image: ghcr.io/wongyiuming/frontiercloud-gin-web@sha256:8101bf3e423648ed4f1c2a29e671286a6391963ef562f55be4579476d45779de
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/operator/install-foc.sh"]
    command: ["auto"]
    environment:
      FOC_COMPOSE_INSTALL: "1"
      FOC_AUTOMATIC_PROJECT: "1"
      FOC_OPERATOR_REVISION: 1ce61b545727a19059a7ba82eb8bd45a9c93aa14
    labels:
      frontiercloud.foc-bootstrap: "1"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - {type: bind, source: /usr, target: /host/usr, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc, target: /host/etc, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /usr/local/bin, target: /usr/local/bin, bind: {create_host_path: false}}
      - {type: bind, source: /usr/local/lib/frontiercloud, target: /usr/local/lib/frontiercloud}
      - {type: bind, source: /etc/frontiercloud, target: /etc/frontiercloud}

  secrets-init:
    depends_on:
      foc-host-init: {condition: service_completed_successfully}
    <<: *app-image
    user: "0:0"
    command: [init-secrets]
    environment: *app-environment
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:z
      - runtime_secrets:/run/frontiercloud-secrets
    logging: *service-logging

  media-init:
    depends_on:
      foc-host-init: {condition: service_completed_successfully}
    <<: *app-image
    user: "0:0"
    command: [init-media]
    environment: *app-environment
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:z
    logging: *service-logging

  certificate-init:
    depends_on:
      foc-host-init: {condition: service_completed_successfully}
    <<: *app-image
    user: "0:10001"
    command: [init-certificate]
    environment: *app-environment
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 24
    volumes:
      - certificate_state:/var/lib/frontiercloud-certificate
      - certificate_runtime:/run/frontiercloud-certificate
      - certificate_published:/run/frontiercloud-tls
    logging: *service-logging

  certificate-agent:
    <<: *app-image
    user: "0:10001"
    command: [certificate-agent]
    environment:
      <<: *app-environment
      GOMAXPROCS: "1"
      GOMEMLIMIT: 64MiB
      GOGC: "50"
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 24
    expose: ["80"]
    depends_on:
      certificate-init: {condition: service_completed_successfully}
    volumes:
      - certificate_state:/var/lib/frontiercloud-certificate
      - certificate_runtime:/run/frontiercloud-certificate
      - certificate_published:/run/frontiercloud-tls
    tmpfs: ["/tmp:size=16m,mode=1777"]
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /app/frontiercloud, certificate-healthcheck]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *service-logging

  web:
    <<: *app-image
    command: [serve]
    user: "10001:10001"
    restart: always
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    expose: ["8000"]
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      media-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      certificate-agent: {condition: service_started}
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:z
      - web_tmp:/tmp
      - runtime_secrets:/run/frontiercloud-secrets
      - certificate_runtime:/run/frontiercloud-certificate:ro
      - traffic_runtime:/run/frontiercloud-traffic:ro
    healthcheck:
      test: [CMD, /app/frontiercloud, healthcheck]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 4
      start_period: 15s
    stop_grace_period: 30s
    logging: *service-logging

  redis:
    image: redis:7.4.11-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    mem_limit: 256m
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *service-logging

  nginx:
    image: ghcr.io/wongyiuming/frontiercloud-gin-nginx:${FRONTIERCLOUD_REVISION:-latest}
    restart: always
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-false}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      INSTANCE_NAME: ${INSTANCE_NAME:-frontiercloud}
      PUBLIC_BIND_ADDRESS: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
      UPLOAD_INACTIVITY_TIMEOUT: ${ADMIN_UPLOAD_INACTIVITY_TIMEOUT:-300}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
      - target: 443
        published: "443"
        protocol: tcp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
    volumes:
      - ${DATA_DIRECTORY:-./data}:/app/data:ro,z
      - certificate_published:/run/frontiercloud-tls:ro
      - traffic_runtime:/run/frontiercloud-traffic
    depends_on:
      web: {condition: service_healthy}
      certificate-agent: {condition: service_started}
    healthcheck:
      test: [CMD, /usr/local/bin/frontiercloud-tls-edge, ready]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging: *service-logging

  stun:
    image: coturn/coturn:4.17.2-r0-alpine
    restart: always
    command: [-n, --stun-only, --no-auth, --no-cli, --no-tls, --no-dtls, --fingerprint, --no-multicast-peers, --log-file=stdout, --simple-log, --listening-port=3478]
    ports:
      - target: 3478
        published: "${WEBRTC_STUN_PORT:-3478}"
        protocol: tcp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
      - target: 3478
        published: "${WEBRTC_STUN_PORT:-3478}"
        protocol: udp
        host_ip: ${PUBLIC_BIND_ADDRESS:-0.0.0.0}
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
      - /var/lib/coturn:size=4m,mode=0700
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 32m
    cpus: "0.20"
    pids_limit: 64
    logging: *service-logging

volumes:
  web_tmp:
  runtime_secrets:
  redis_data:
  certificate_state:
  certificate_runtime:
  certificate_published:
  traffic_runtime:
