# Optional drop-in: the operator must wire this public directory into the
# existing hostname's HTTP-01 route and grant UID/GID 10001 directory access.
[Service]
ExecStart=
ExecStart=/usr/local/libexec/frontiercloud certificate-agent --hostname ${CERTIFICATE_HOSTNAME} --directory /opt/frontiercloud-storage/certificate-state --socket /run/frontiercloud-certificate/control.sock --acme-directory ${CERTIFICATE_ACME_DIRECTORY} --http01-directory /opt/frontiercloud-http01/.well-known/acme-challenge
ReadWritePaths=/opt/frontiercloud-http01/.well-known/acme-challenge
