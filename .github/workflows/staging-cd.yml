name: Trigger preproduction CD

on:
  workflow_run:
    workflows: ["Publish native images"]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  notify-staging:
    if: >-
      github.repository == 'wongyiuming/FrontierCloud-Gin' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # Pre-create this Environment with a Branch rule allowing only main.
    # STAGING_CD_SECRET must exist only here, not as a repository/org secret.
    environment: staging-cd-main
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    concurrency:
      group: trusted-preproduction-notification
      cancel-in-progress: false
    steps:
      # workflow_run executes the default-main definition. Checkout only that
      # workflow's immutable trusted SHA, never workflow_run.head_sha or dev.
      # No candidate artifacts, caches, dependencies or container code execute.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/trusted_staging_notify.py
            scripts/registry_images.py
          sparse-checkout-cone-mode: false
      - name: Verify exact source CI and all public images before signed wakeup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_CD_SECRET: ${{ secrets.STAGING_CD_SECRET }}
        run: timeout --signal=TERM --kill-after=5s 150s python3 scripts/trusted_staging_notify.py
