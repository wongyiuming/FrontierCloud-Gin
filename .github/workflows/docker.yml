name: Build and Test Docker Compose

permissions:
  contents: read
  actions: read

on:
  push:
    branches: ["dev", "main"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  promote-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify exact reviewed native tree and newest source push
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const target = context.sha;
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: target });
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: target, per_page: 100,
            });
            const pulls = Array.isArray(associated.data) ? associated.data : [];
            const sources = [...new Set(pulls.filter(pr =>
              pr?.merged_at && pr?.merge_commit_sha === target &&
              pr?.base?.ref === 'main' && pr?.head?.ref === 'dev' &&
              pr?.head?.repo?.full_name === `${owner}/${repo}` &&
              /^[0-9a-f]{40}$/.test(pr?.head?.sha || '')
            ).map(pr => pr.head.sha))];
            if (pulls.length >= 100 || sources.length !== 1) {
              core.setFailed('Native HEAD has no unique exact merged same-repository dev -> main PR');
              return;
            }
            const source = sources[0];
            const reviewed = await github.rest.repos.getCommit({ owner, repo, ref: source });
            if (reviewed.data.sha !== source || reviewed.data.commit.tree.sha !== commit.data.commit.tree.sha) {
              core.setFailed('Native production tree differs from its reviewed source tree');
              return;
            }
            const result = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'docker.yml', event: 'push', head_sha: source, per_page: 20,
            });
            const runs = Array.isArray(result.data?.workflow_runs) ? result.data.workflow_runs : [];
            const matching = runs.filter(run => run?.head_sha === source && run?.head_branch === 'dev' && run?.event === 'push');
            matching.sort((a, b) => b.run_number - a.run_number);
            const newest = matching[0];
            if (!newest || newest.status !== 'completed' || newest.conclusion !== 'success') {
              core.setFailed('Newest exact native source push CI has not succeeded');
              return;
            }
            core.notice(`main ${target} promotes dev ${source}, CI #${newest.run_number}`);

  test-native:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: source-${{ github.event_name }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Bounded source, policy and frontend checks only
        run: timeout --signal=TERM --kill-after=5s 150s bash scripts/test-ci-source.sh

  verify-promotion-query:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify exact dev SHA lookup
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'docker.yml',
              event: 'push',
              head_sha: context.sha,
              per_page: 20,
            });
            const runs = Array.isArray(response.data?.workflow_runs)
              ? response.data.workflow_runs
              : [];
            const run = runs.find(item =>
              item?.head_sha === context.sha &&
              item?.head_branch === 'dev' &&
              item?.event === 'push'
            );
            if (!run) {
              core.setFailed(`dev ${context.sha} cannot be resolved by the promotion query`);
              return;
            }
            core.notice(`promotion query resolves dev ${context.sha} as CI #${run.run_number}`);
