worker_processes 1;
events { worker_connections 32; }
http {
    server {
        listen 8080;
        set $frontiercloud_hsts "";
        set $frontiercloud_csp "default-src 'none'; frame-ancestors 'none'";
        include /etc/nginx/maintenance-gate.conf;
        location / { return 200 "business handler\n"; }
    }
}
