events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    map $host $frontiercloud_csp { default "default-src 'none'"; }
    map $host $frontiercloud_hsts { default ""; }
    server {
        listen 127.0.0.1:8081;
        add_header Content-Security-Policy "default-src *" always;
        add_header X-Content-Type-Options "upstream" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "unsafe-url" always;
        add_header Permissions-Policy "microphone=*" always;
        add_header Strict-Transport-Security "max-age=1" always;
        add_header X-Media-Resource-ID "private-resource" always;
        add_header X-Media-Owner-ID "private-owner" always;
        add_header X-Media-Object-ID "private-object" always;
        add_header X-Media-Parent-Request-ID "private-parent" always;
        add_header X-Audit-Trace-ID "private-trace" always;
        add_header Set-Cookie "synthetic=upstream" always;
        add_header X-Accel-Redirect "/should-not-be-followed" always;
        return 200 "synthetic-body";
    }
    server {
        listen 127.0.0.1:8080;
        include /etc/nginx/proxy-response-headers.conf;
        include /etc/nginx/security-headers.conf;
        location /cache {
            proxy_hide_header Cache-Control;
            include /etc/nginx/proxy-response-headers.conf;
            proxy_ignore_headers X-Accel-Redirect;
            add_header Cache-Control "private, no-store" always;
            include /etc/nginx/security-headers.conf;
            proxy_pass http://127.0.0.1:8081;
        }
        location /relay {
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Accel-Redirect;
            include /etc/nginx/proxy-response-headers.conf;
            proxy_ignore_headers X-Accel-Redirect;
            proxy_pass http://127.0.0.1:8081;
        }
        location /should-not-be-followed {
            internal;
            return 418 "unsafe-followed";
        }
    }
}
