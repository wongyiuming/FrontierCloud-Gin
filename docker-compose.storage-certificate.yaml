# Optional certificate containers; combine with docker-compose.storage.yaml.
# Linux temporary HTTP-01 binds host 80 only during validation; no port mapping.
x-certificate-image: &certificate-image
  image: frontiercloud-go-web:${FRONTIERCLOUD_REVISION:?Set the exact committed source SHA}
  build:
    context: .
    dockerfile: Dockerfile.gin
    args: {REVISION: "${FRONTIERCLOUD_REVISION:?Set the exact committed source SHA}"}

services:
  certificate-init:
    <<: *certificate-image
    command: [init-certificate]
    user: "0:10001"
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 24
    volumes:
      - certificate_state:/var/lib/frontiercloud-certificate
      - certificate_runtime:/run/frontiercloud-certificate
      - certificate_http01:/run/frontiercloud-http01

  certificate-agent:
    <<: *certificate-image
    command: [certificate-agent, --container, --hostname, "${SERVER_NAME:?Set storage hostname}", --directory, /var/lib/frontiercloud-certificate, --socket, /run/frontiercloud-certificate/control.sock, --acme-directory, "${CERTIFICATE_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}"]
    user: "0:10001"
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    network_mode: host
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 24
    environment: {GOMAXPROCS: "1", GOMEMLIMIT: 64MiB, GOGC: "50", SERVER_NAME: "${SERVER_NAME:?Set storage hostname}"}
    depends_on:
      certificate-init: {condition: service_completed_successfully}
    volumes:
      - certificate_state:/var/lib/frontiercloud-certificate
      - certificate_runtime:/run/frontiercloud-certificate
      - certificate_http01:/run/frontiercloud-http01
    tmpfs: ["/tmp:size=16m,mode=1777"]
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /app/frontiercloud, certificate-healthcheck]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  web:
    environment:
      STORAGE_CERTIFICATE_DIRECTORY: /run/frontiercloud-certificate-tls
      STORAGE_CERTIFICATE_SOCKET: /run/frontiercloud-certificate/control.sock
    depends_on:
      certificate-agent: {condition: service_started}
    volumes:
      - certificate_state:/run/frontiercloud-certificate-tls:ro
      - certificate_runtime:/run/frontiercloud-certificate:ro

volumes:
  certificate_state:
  certificate_runtime:
  certificate_http01:
