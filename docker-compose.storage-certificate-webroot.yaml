# Optional reuse of an existing business HTTP-01 directory, without a new route.
# Local Compose selects this public-proof-only path; network callers cannot.
services:
  certificate-agent:
    network_mode: bridge
    cap_add: !reset []
    command: [certificate-agent, --container, --hostname, "${SERVER_NAME:?Set storage hostname}", --directory, /var/lib/frontiercloud-certificate, --socket, /run/frontiercloud-certificate/control.sock, --acme-directory, "${CERTIFICATE_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}", --http01-directory, /run/frontiercloud-http01]
    volumes:
      - type: bind
        source: ${STORAGE_CERTIFICATE_HTTP01_DIRECTORY:?Set the existing public challenge directory}
        target: /run/frontiercloud-http01
        bind: {create_host_path: false}
