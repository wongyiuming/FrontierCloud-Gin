# Standalone storage appliance. Do NOT combine with the business Compose file.
name: ${COMPOSE_PROJECT_NAME:-frontiercloud-storage}

x-storage-image: &storage-image
  image: ghcr.io/wongyiuming/frontiercloud-gin-web:${FRONTIERCLOUD_REVISION:-latest}
  env_file:
    - path: .env
      required: false

x-storage-env: &storage-env
  DEPLOYMENT_MODE: only_stroge
  DB_TYPE: sqlite
  SQLITE_PATH: /app/data/frontiercloud.db
  DATA_ROOT: /app/data
  SECRETS_DIR: /run/frontiercloud-secrets
  TLS_ENABLED: ${TLS_ENABLED:-true}
  NGINX_MEDIA_ACCEL: "false"
  HTTP_ADDR: :${STORAGE_PORT:-443}
  STORAGE_TRANSPORT: ${STORAGE_TRANSPORT:-direct}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?Set a certificate-verified HTTPS root URL matching the storage network profile}
  STORAGE_PORT: ${STORAGE_PORT:-443}
  SERVER_NAME: ${SERVER_NAME:?Set the storage certificate hostname}
  WEBRTC_STUN_PORT: ${WEBRTC_STUN_PORT:-3478}

services:
  # Optional host command; install explicitly with --profile operator run.
  foc-host-init:
    profiles: [operator]
    image: ghcr.io/wongyiuming/frontiercloud-gin-web@sha256:8101bf3e423648ed4f1c2a29e671286a6391963ef562f55be4579476d45779de
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/operator/install-foc.sh"]
    command: ["auto"]
    environment:
      FOC_COMPOSE_INSTALL: "1"
      FOC_AUTOMATIC_PROJECT: "1"
      FOC_OPERATOR_REVISION: 1ce61b545727a19059a7ba82eb8bd45a9c93aa14
    labels:
      frontiercloud.foc-bootstrap: "1"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - {type: bind, source: /usr, target: /host/usr, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc, target: /host/etc, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /usr/local/bin, target: /usr/local/bin, bind: {create_host_path: false}}
      - {type: bind, source: /usr/local/lib/frontiercloud, target: /usr/local/lib/frontiercloud}
      - {type: bind, source: /etc/frontiercloud, target: /etc/frontiercloud}

  secrets-init:
    <<: *storage-image
    user: "0:0"
    command: [init-secrets]
    environment: *storage-env
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${DATA_DIRECTORY:-./storage-data}:/app/data:z
      - storage_secrets:/run/frontiercloud-secrets

  media-init:
    <<: *storage-image
    user: "0:0"
    command: [init-media]
    environment: *storage-env
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ${DATA_DIRECTORY:-./storage-data}:/app/data:z

  certificate-init:
    <<: *storage-image
    user: "0:10001"
    command: [init-certificate]
    environment: *storage-env
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 24
    volumes:
      - certificate_state:/var/lib/frontiercloud-certificate
      - certificate_runtime:/run/frontiercloud-certificate
      - certificate_published:/run/frontiercloud-tls
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  certificate-agent:
    <<: *storage-image
    user: "0:10001"
    command: [certificate-agent]
    environment:
      <<: *storage-env
      GOMAXPROCS: "1"
      GOMEMLIMIT: 64MiB
      GOGC: "50"
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpus: 0.05
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 24
    network_mode: host
    depends_on:
      certificate-init: {condition: service_completed_successfully}
    volumes:
      - certificate_state:/var/lib/frontiercloud-certificate
      - certificate_runtime:/run/frontiercloud-certificate
      - certificate_published:/run/frontiercloud-tls
    tmpfs: ["/tmp:size=16m,mode=1777"]
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /app/frontiercloud, certificate-healthcheck]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  web:
    <<: *storage-image
    command: [serve]
    user: "10001:10001"
    environment: *storage-env
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${STORAGE_PORT:-443}:${STORAGE_PORT:-443}"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${WEBRTC_STUN_PORT:-3478}:${WEBRTC_STUN_PORT:-3478}/udp"
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      media-init: {condition: service_completed_successfully}
      certificate-agent: {condition: service_started}
    volumes:
      - ${DATA_DIRECTORY:-./storage-data}:/app/data:z
      - storage_secrets:/run/frontiercloud-secrets
      - certificate_published:/run/frontiercloud-tls:ro
      - certificate_runtime:/run/frontiercloud-certificate:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, /app/frontiercloud, healthcheck]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 4
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  storage_secrets:
  certificate_state:
  certificate_runtime:
  certificate_published:
