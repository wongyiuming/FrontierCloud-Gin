# Linux-only explicit temporary listener, with no permanent Docker port mapping.
# Combine after storage + certificate Compose; default shared mode stays bridged.
services:
  certificate-agent:
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    command: [certificate-agent, --container, --hostname, "${SERVER_NAME:?Set storage hostname}", --directory, /var/lib/frontiercloud-certificate, --socket, /run/frontiercloud-certificate/control.sock, --acme-directory, "${CERTIFICATE_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}"]
