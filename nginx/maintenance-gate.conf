set $frontiercloud_maintenance 0;
# Manual maintenance is owned by the Web Admin through the shared data directory.
if (-f /app/data/.frontiercloud-maintenance) { set $frontiercloud_maintenance 1; }
# Keep Admin and cluster control reachable while public business traffic is gated.
if ($uri ~ "^/(?:api/v1/media/admin(?:/|$)|static(?:/|$)|health(?:/|$)|metrics$|__maintenance\.html$)") { set $frontiercloud_maintenance 0; }
# Native offline recovery is stricter than UI/release maintenance. No Admin,
# cluster-control or force-open exception may admit writes or serve media while
# the native lifecycle is being drained. Python workers still need proof of stop.
if (-e /app/data/.frontiercloud-native-maintenance) { set $frontiercloud_maintenance 1; }
# The fixed internal error page is read-only and must not recurse into the gate.
if ($uri = /__maintenance.html) { set $frontiercloud_maintenance 0; }
if ($frontiercloud_maintenance = 1) { return 503; }
error_page 503 /__maintenance.html;
location = /__maintenance.html {
    internal;
    alias /usr/share/nginx/html/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
}
