# A location declaring any proxy_hide_header does not inherit the parent's
# list. Include this file there as well to preserve the complete boundary.
proxy_hide_header X-Media-Resource-ID;
proxy_hide_header X-Media-Owner-ID;
proxy_hide_header X-Media-Object-ID;
proxy_hide_header X-Media-Parent-Request-ID;
proxy_hide_header X-Audit-Trace-ID;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
